/* Firebase room adapter for Dosto ka Chat. Runs in same-origin iframe and reuses parent Firebase auth/database. */
window.claude = {
  use: async function (service) {
    if (service !== 'room') throw new Error('Unsupported service');
    const hostWin = window.parent;
    const fb = hostWin && hostWin.firebase;
    if (!fb || !fb.database || !fb.auth) throw new Error('Parent Firebase SDK nahi mila.');
    const auth = fb.auth();
    const user = auth.currentUser;
    if (!user) throw new Error('Pehle Dosto ka Chat mein login karo.');
    const db = fb.database();
    return {
      join: async function (roomName, isHost) {
        const code = String(roomName || '').replace(/^dosto-/, '').toLowerCase();
        if (!/^[a-z0-9]{3,12}$/.test(code)) throw new Error('Room code galat hai.');
        const ref = db.ref('showdownRooms/' + code);
        const uid = user.uid;
        const initial = await ref.transaction(function (current) {
          if (isHost) {
            if (current) return;
            return { host: uid, status: 'lobby', createdAt: fb.database.ServerValue.TIMESTAMP, players: { [uid]: { joinedAt: fb.database.ServerValue.TIMESTAMP, presence: { role: 'host' } } } };
          }
          if (!current || current.status !== 'lobby') return;
          current.players = current.players || {};
          if (current.players[uid]) return current;
          if (Object.keys(current.players).length >= 2) return;
          current.players[uid] = { joinedAt: fb.database.ServerValue.TIMESTAMP, presence: { role: 'guest' } };
          return current;
        });
        if (!initial.committed) throw new Error(isHost ? 'Ye room code pehle se use ho raha hai. Naya room banao.' : 'Room nahi mila, full hai ya game start ho chuka hai.');
        const playersRef = ref.child('players');
        let players = {};
        const peerListeners = [];
        const eventListeners = [];
        let left = false;
        const peers = () => Object.keys(players || {}).map(id => ({ isMe: id === uid, uid: id, presence: players[id] && players[id].presence || {} }));
        const room = {
          peers,
          presence: async data => {
            if (left) return;
            await playersRef.child(uid).update({ presence: data, lastSeen: fb.database.ServerValue.TIMESTAMP });
          },
          onPeers: callback => {
            const fn = snap => { players = snap.val() || {}; callback(); };
            playersRef.on('value', fn);
            peerListeners.push(() => playersRef.off('value', fn));
            return () => { playersRef.off('value', fn); };
          },
          on: (event, callback) => {
            const eventRef = ref.child('events/' + event);
            let lastSeq = null;
            const fn = snap => {
              const value = snap.val();
              if (!value || value.sender === uid || value.seq === lastSeq) return;
              lastSeq = value.seq;
              callback({ isMe: false, data: value.data });
            };
            let actQuery = null, actFn = null;
            if (event === 'act') {
              actQuery = eventRef.limitToLast(30);
              actFn = snap => {
                const value = snap.val();
                if (value && value.sender !== uid) callback({ isMe: false, data: value.data });
              };
              actQuery.on('child_added', actFn);
            } else eventRef.on('value', fn);
            const off = () => {
              if (actQuery) actQuery.off('child_added', actFn);
              else eventRef.off('value', fn);
            };
            eventListeners.push(off);
            return off;
          },
          emit: async (event, data) => {
            if (left) return;
            const value = { sender: uid, seq: Date.now() + '-' + Math.random().toString(36).slice(2), data: data };
            if (event === 'act') await ref.child('events/act').push(value);
            else await ref.child('events/' + event).set(value);
          },
          leave: async () => {
            if (left) return;
            left = true;
            peerListeners.concat(eventListeners).forEach(fn => { try { fn(); } catch (_) {} });
            if (isHost) await ref.remove();
            else await playersRef.child(uid).remove();
          }
        };
        players = (initial.snapshot.val() && initial.snapshot.val().players) || {};
        try {
          if (isHost) ref.onDisconnect().remove();
          else playersRef.child(uid).onDisconnect().remove();
        } catch (_) {}
        return room;
      }
    };
  }
};

 if(k==='h'){const x=a[1],y=a[2],d=a[3];if(a[4]){spark(x,y,'#93c5fd');sfx.block()}else{spark(x,y,'#fbbf24',16);spark(x,y,'#fff',6);shake=d>100?16:6;sfx.hit(d>100);navigator.vibrate&&navigator.vibrate(d>100?40:15)}txt(x,y-20,d,a[4]?'#93c5fd':'#fff')}

 for(const f of[P,E]){const o=f===P?E:P;f.dir=o.x>f.x?1:-1;f.x+=((f.tx==null?f.x:f.tx)-f.x)*Math.min(1,dt*18);

 const o={role:'guest',ci:sel[1],l:inp.l|0,r:inp.r|0,dn:inp.dn|0,b:inp.block|0,m:Math.round((inp.mag||1)*5)/5},k=JSON.stringify(o);if(k!==net.lk){net.lk=k;net.room.presence(o).catch(()=>{})}

 else{c.setTransform(cv.width/W,0,0,cv.height/H,0,0);if(scene==='fight'){gpad();net&&!net.host?gstep(dt):step(dt)}render()}

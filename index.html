  <script>
  (() => {
    'use strict';

    // --- TEENO FIREBASE PROJECTS KI CONFIGURATIONS ---
    const firebaseConfigs = [
      {
        apiKey: 'YOUR_PROJECT_1_API_KEY',
        authDomain: 'project1.firebaseapp.com',
        databaseURL: 'https://project1-default-rtdb.asia-southeast1.firebasedatabase.app',
        projectId: 'project1',
        appId: '1:111:web:abc'
      },
      {
        apiKey: 'YOUR_PROJECT_2_API_KEY',
        authDomain: 'project2.firebaseapp.com',
        databaseURL: 'https://project2-default-rtdb.asia-southeast1.firebasedatabase.app',
        projectId: 'project2',
        appId: '1:222:web:def'
      },
      {
        apiKey: 'YOUR_PROJECT_3_API_KEY',
        authDomain: 'project3.firebaseapp.com',
        databaseURL: 'https://project3-default-rtdb.asia-southeast1.firebasedatabase.app',
        projectId: 'project3',
        appId: '1:333:web:ghi'
      }
    ];

    const ADMIN_UID = 'TkdZFaOuM8huIE3I5l6TSWHfHnY2';
    const CACHE_KEY = 'dosto_chat_history_v3';
    const $ = id => document.getElementById(id);

    let auth = null;
    let primaryDb = null;
    let allDatabases = []; // Teeno databases ka pool
    let dbIndex = 0;       // Round-robin counter

    let currentUser = null;
    let currentProfile = null;
    let isAdmin = false;
    let signupMode = false;
    let busy = false;
    let activeUid = null;
    let isBanned = false;
    let muteUntil = 0;
    let chatEnabled = true;
    let muteTimer = null;
    let lastMessages = [];
    let adminData = {users:{}, online:{}, bans:{}, mutes:{}};
    let allProfiles = {};
    const BG_KEY = 'dosto_chat_background_v1';

    // Helper: Get next database dynamically (Load Balancing)
    function getNextDatabase() {
      const dbInstance = allDatabases[dbIndex];
      dbIndex = (dbIndex + 1) % allDatabases.length; // Rotate 0 -> 1 -> 2 -> 0
      return dbInstance;
    }

    function showError(message) { $('err').textContent = message || ''; }
    function showStatus(message) { $('status').textContent = message || ''; }
    function adminFeedback(message, isError = false) {
      $('adminMsg').textContent = message || '';
      $('adminMsg').style.color = isError ? '#ff8290' : '#57d69b';
    }

    function friendlyError(error) {
      const code = error && error.code ? error.code : '';
      const messages = {
        'auth/email-already-in-use': 'Ye username pehle se liya gaya hai. Dusra username try karo.',
        'auth/invalid-credential': 'Username ya password galat hai.',
        'auth/user-not-found': 'Ye account nahi mila. Pehle account banao.',
        'auth/wrong-password': 'Password galat hai.',
        'auth/weak-password': 'Password kam se kam 6 characters ka rakho.',
        'auth/network-request-failed': 'Internet connection check karo.'
      };
      return messages[code] || (code ? 'Error: ' + code : 'Error: ' + (error && error.message ? error.message : 'Unknown error'));
    }

    function setBusy(value) {
      busy = value;
      $('go').disabled = value;
      $('go').textContent = value ? 'Please wait...' : (signupMode ? 'Account banao' : 'Login');
    }

    function updateChatControls() {
      const muted = muteUntil > Date.now();
      const blocked = isBanned || muted || !chatEnabled;
      $('text').disabled = blocked;
      $('send').disabled = blocked;
      if (isBanned) {
        $('text').placeholder = 'Is account ko group se ban kiya gaya hai';
        showStatus('Tumhe ban kiya gaya hai.');
      } else if (muted) {
        $('text').placeholder = 'Tum mute ho. Thoda wait karo...';
        showStatus('Tum mute ho.');
      } else if (!chatEnabled) {
        $('text').placeholder = 'Chat abhi admin ne pause kiya hai';
        showStatus('Admin ne filhaal chat pause kiya hai.');
      } else {
        $('text').placeholder = 'Message likho... (Multi-Firebase Active)';
        showStatus('');
      }
    }

    function validateUsername(name) {
      return /^[A-Za-z0-9_]{2,20}$/.test(name);
    }

    $('swap').addEventListener('click', () => {
      signupMode = !signupMode;
      $('title').textContent = signupMode ? 'Naya account' : 'Login';
      $('swap').textContent = signupMode ? 'Pehle se account hai? Login' : 'Naya account banana hai?';
      showError('');
      setBusy(false);
    });

    async function submitLogin() {
      if (busy) return;
      const name = $('name').value.trim();
      const password = $('pass').value;
      if (!validateUsername(name)) {
        showError('Username 2-20 letters, numbers ya _ ka hona chahiye.');
        return;
      }
      if (password.length < 6) {
        showError('Password kam se kam 6 characters ka hona chahiye.');
        return;
      }
      const email = name.toLowerCase() + '@dosto.chat';
      setBusy(true);
      showError('');
      try {
        if (signupMode) {
          const credential = await auth.createUserWithEmailAndPassword(email, password);
          const profile = {
            username: name,
            usernameLower: name.toLowerCase(),
            createdAt: firebase.database.ServerValue.TIMESTAMP
          };
          // Save user profile across all databases for sync
          await Promise.all(allDatabases.map(db => db.ref('users/' + credential.user.uid).set(profile)));
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (error) {
        showError(friendlyError(error));
      } finally {
        setBusy(false);
        if (auth && auth.currentUser) startUserSession(auth.currentUser);
      }
    }

    $('go').addEventListener('click', submitLogin);
    $('pass').addEventListener('keydown', event => { if (event.key === 'Enter') submitLogin(); });
    $('name').addEventListener('keydown', event => { if (event.key === 'Enter') $('pass').focus(); });
    $('out').addEventListener('click', async () => {
      try { await auth.signOut(); location.reload(); }
      catch (error) { showStatus(friendlyError(error)); }
    });

    function ensureProfile(user) {
      const profileRef = primaryDb.ref('users/' + user.uid);
      return profileRef.once('value').then(snapshot => {
        if (snapshot.exists()) return snapshot.val();
        const emailName = (user.email || '').split('@')[0];
        const profile = {
          username: user.displayName || emailName,
          usernameLower: emailName.toLowerCase(),
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };
        return profileRef.set(profile).then(() => profileRef.once('value')).then(s => s.val());
      });
    }

    function startPresence(user, username) {
      const presenceRef = primaryDb.ref('online/' + user.uid);
      return presenceRef.onDisconnect().remove().then(() => presenceRef.set(username));
    }

    async function startUserSession(user) {
      if (activeUid === user.uid) return;
      activeUid = user.uid;
      currentUser = user;
      showError('');
      try {
        currentProfile = await ensureProfile(user);
        isAdmin = user.uid === ADMIN_UID;
        if (window.DostoBridge) window.DostoBridge.setUser({uid:user.uid, username:currentProfile.username, isAdmin});
        
        const banSnapshot = await primaryDb.ref('bans/' + user.uid).once('value');
        if (banSnapshot.val() === true) {
          isBanned = true;
          await auth.signOut();
          showError('Tumhe ban kiya gaya hai.');
          activeUid = null;
          return;
        }
        isBanned = false;
        $('join').style.display = 'none';
        $('app').style.display = 'flex';
        $('welcome').textContent = 'Logged in as ' + currentProfile.username + ' (Multi-DB)';
        renderMyAvatar();
        applySavedBackground();
        await startPresence(user, currentProfile.username);
        attachLiveData(user.uid);
        if (isAdmin) attachAdminData();
      } catch (error) {
        showError(friendlyError(error));
        activeUid = null;
        try { await auth.signOut(); } catch (_) {}
      }
    }

    function attachLiveData(uid) {
      primaryDb.ref('online').on('value', snapshot => {
        const people = snapshot.val() || {};
        const names = Object.values(people).filter(Boolean);
        $('online').textContent = '● Online (' + names.length + '): ' + names.join(', ');
      });

      primaryDb.ref('users').on('value', snapshot => {
        allProfiles = snapshot.val() || {};
        renderMembers();
        renderMyAvatar();
      });

      // --- MULTI-DATABASE MESSAGE LISTENER ---
      // Teeno Firebase projects se messages ko ek sath listen karke merge karna
      let dbMessagesMap = {};

      allDatabases.forEach((database, dbIdx) => {
        database.ref('messages').limitToLast(50).on('value', snapshot => {
          let projectMessages = [];
          snapshot.forEach(child => {
            const val = child.val();
            if (val && typeof val.text === 'string') {
              projectMessages.push({ key: `db${dbIdx}_` + child.key, ...val });
            }
          });
          dbMessagesMap[dbIdx] = projectMessages;

          // Combine all messages from all 3 databases and sort by timestamp
          let combined = [];
          Object.values(dbMessagesMap).forEach(list => combined.push(...list));
          combined.sort((a, b) => (a.ts || 0) - (b.ts || 0));

          lastMessages = combined.slice(-100);
          drawAllMessages(lastMessages);
        });
      });

      primaryDb.ref('bans/' + uid).on('value', async snapshot => {
        if (snapshot.val() === true && !isBanned) {
          isBanned = true;
          updateChatControls();
          try { await auth.signOut(); } catch (_) {}
        }
      });

      primaryDb.ref('mutes/' + uid).on('value', snapshot => {
        const value = snapshot.val();
        muteUntil = value && Number(value.until) > Date.now() ? Number(value.until) : 0;
        updateChatControls();
      });

      primaryDb.ref('settings/chatEnabled').on('value', snapshot => {
        chatEnabled = snapshot.val() !== false;
        updateChatControls();
      });

      primaryDb.ref('.info/connected').on('value', snapshot => {
        $('connection').textContent = snapshot.val() ? 'Connected (Multi-Firebase)' : 'Reconnecting...';
        $('connection').style.color = snapshot.val() ? '#57d69b' : '#ffd27a';
      });
    }

    function drawAllMessages(messages) {
      const box = $('msgs');
      box.replaceChildren();
      messages.forEach(message => drawMessage(message, box));
      box.scrollTop = box.scrollHeight;
    }

    function drawMessage(message, box) {
      const row = document.createElement('div');
      const mine = !!(currentUser && message.uid === currentUser.uid);
      row.className = 'msg-row' + (mine ? ' mine' : '');
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      const profile = allProfiles[message.uid] || {};
      if (profile.avatar) {
        const img = document.createElement('img'); img.src = profile.avatar; img.alt = '';
        avatar.appendChild(img);
      } else avatar.textContent = String(message.user || '?').slice(0,1).toUpperCase();
      
      const item = document.createElement('article');
      item.className = 'msg' + (mine ? ' me' : '');
      const name = document.createElement('b');
      name.textContent = message.user || 'Unknown';
      const content = document.createElement('span');
      content.textContent = message.text || '';
      const stamp = document.createElement('span');
      stamp.className = 'stamp';
      const time = Number(message.ts);
      stamp.textContent = Number.isFinite(time) && time > 0 ? new Date(time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
      item.append(name, content, stamp);
      
      row.append(avatar, item);
      box.appendChild(row);
    }

    // --- SMART ROUND-ROBIN MESSAGE SENDING ---
    async function sendMessage() {
      const text = $('text').value.trim();
      if (!text || !currentUser || !currentProfile || isBanned || muteUntil > Date.now() || !chatEnabled) return;
      $('send').disabled = true;
      try {
        // Automatically selects next database in rotation (Project 1 -> Project 2 -> Project 3)
        const targetDb = getNextDatabase();

        await targetDb.ref('messages').push({
          uid: currentUser.uid,
          user: currentProfile.username,
          text: text.slice(0, 1000),
          ts: firebase.database.ServerValue.TIMESTAMP
        });
        $('text').value = '';
        showStatus('');
      } catch (error) {
        showStatus(friendlyError(error));
      } finally {
        updateChatControls();
      }
    }

    $('send').addEventListener('click', sendMessage);
    $('text').addEventListener('keydown', event => { if (event.key === 'Enter') sendMessage(); });

    // UI helpers (Avatar, Background, etc.)
    function setAvatar(el, data, fallback) {
      el.replaceChildren();
      if (data) {
        const img = document.createElement('img'); img.src = data; img.alt = '';
        el.appendChild(img);
      } else el.textContent = fallback || 'D';
    }
    function renderMyAvatar() {
      if (!currentUser || !currentProfile) return;
      const profile = allProfiles[currentUser.uid] || currentProfile;
      setAvatar($('myAvatar'), profile.avatar, profile.username?.slice(0,1).toUpperCase() || 'D');
    }
    function renderMembers() {
      const list = $('membersList');
      if (!list) return;
      list.replaceChildren();
      const entries = Object.entries(allProfiles || {});
      $('membersCount').textContent = entries.length + ' registered members';
      entries.forEach(([uid, profile]) => {
        const row = document.createElement('div'); row.className = 'member-row';
        const avatar = document.createElement('div'); avatar.className = 'avatar';
        setAvatar(avatar, profile?.avatar, String(profile?.username || '?').slice(0,1).toUpperCase());
        const info = document.createElement('div'); info.className = 'member-info';
        const name = document.createElement('b'); name.textContent = profile?.username || 'Member';
        info.append(name); row.append(avatar, info); list.appendChild(row);
      });
    }

    function applySavedBackground() {
      let bg = '';
      try { bg = localStorage.getItem(BG_KEY) || ''; } catch (_) {}
      document.body.style.backgroundImage = bg ? `url("${bg}")` : '';
      $('app').style.backgroundImage = bg ? `linear-gradient(#0c1220d9,#0c1220e8),url("${bg}")` : '';
      $('app').style.backgroundSize = 'cover';
    }

    // --- INITIALIZE ALL FIREBASE APPS & START ---
    try {
      // Initialize Project 1 (Primary)
      const app1 = firebase.initializeApp(firebaseConfigs[0], 'app1');
      primaryDb = app1.database();
      allDatabases.push(primaryDb);
      auth = app1.auth();

      // Initialize Project 2
      const app2 = firebase.initializeApp(firebaseConfigs[1], 'app2');
      allDatabases.push(app2.database());

      // Initialize Project 3
      const app3 = firebase.initializeApp(firebaseConfigs[2], 'app3');
      allDatabases.push(app3.database());

      auth.onAuthStateChanged(user => {
        if (!user) {
          currentUser = null;
          currentProfile = null;
          isAdmin = false;
          activeUid = null;
          $('join').style.display = 'block';
          $('app').style.display = 'none';
          return;
        }
        if (!busy) startUserSession(user);
      });
    } catch (error) {
      showError('Multi-Firebase start error: ' + error.message);
    }
  })();
  </script>

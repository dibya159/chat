<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosto ka Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ea;height:100dvh;display:flex;flex-direction:column}
#join{margin:auto;text-align:center;padding:24px;width:min(360px,92%)}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #333;background:#1b1e25;color:inherit;font-size:16px}
button{padding:12px 18px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:16px;cursor:pointer}
#join button{margin-top:12px;width:100%}
#swap{background:none;color:#8fb0ff;font-size:14px;margin-top:4px}
#err{color:#ff6b6b;min-height:20px;margin-top:8px;font-size:14px}
#app{display:none;flex-direction:column;height:100%}
header{padding:10px 14px;background:#171a21;border-bottom:1px solid #262a33;font-size:14px}
#top{display:flex;justify-content:space-between;align-items:center}
#out{padding:4px 10px;font-size:12px;background:#2a2f3a}
#online{color:#6ee7a0;margin-top:4px;overflow-x:auto;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:#1b1e25;word-wrap:break-word}
.m b{display:block;font-size:12px;color:#8fb0ff;margin-bottom:2px}
.m.me{align-self:flex-end;background:#2b4bb5}
.m.me b{display:none}
.sys{align-self:center;font-size:12px;color:#888}
#bar{display:flex;gap:8px;padding:10px;background:#171a21}
#bar input{margin:0}
#panel{display:none;position:fixed;inset:0;background:#0f1115;overflow:auto;padding:14px;z-index:10}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid #262a33}
.row span{flex:1 1 100%}
.row button{padding:6px 10px;font-size:13px;background:#2a2f3a}
#adm{display:none;padding:4px 10px;font-size:12px;background:#2a2f3a;margin-right:6px}
.del{background:none;font-size:12px;padding:0 4px;color:#888}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
window.addEventListener("error", function (e) { if (!e.message || e.message === "Script error.") return; var x = document.getElementById("err"); if (x) x.textContent = "JS error: " + e.message; });
setTimeout(function () { if (!window.__ok) { var x = document.getElementById("err"); if (x) x.textContent = "App load nahi hui: internet/adblock check karo ya page refresh karo"; } }, 15000);
</script>
</head>
<body>
<div id="join">
  <h2 id="title">Login</h2>
  <input id="name" maxlength="20" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <button id="go">Login</button>
  <button id="swap">Naya account banana hai?</button>
  <div id="err"></div>
</div>
<div id="app">
  <header>
    <div id="top"><b>Dosto ka Chat</b><span><button id="adm">Admin</button><button id="out">Logout</button></span></div>
    <div id="online"></div>
  </header>
  <div id="msgs"></div>
  <div id="bar"><input id="text" placeholder="Message likho..." autocomplete="off"><button id="send">Send</button></div>
</div>

<div id="panel">
  <button id="pclose">Band karo</button>
  <h3>Admin Panel</h3>
  <div id="plist"></div>
</div>

<script type="module">
if (!window.firebase) {
  document.getElementById("err").textContent = "Firebase script load nahi hui (Google ka server block ho raha hai)";
  throw new Error("firebase missing");
}
const fb = window.firebase;
const initializeApp = c => fb.initializeApp(c);
const getAuth = () => fb.auth(), getDatabase = () => fb.database();
const ref = (d, p) => d.ref(p), push = (r, v) => r.push(v), set = (r, v) => r.set(v), remove = r => r.remove();
const onDisconnect = r => r.onDisconnect();
const limitToLast = n => r => r.limitToLast(n);
const query = (r, ...m) => m.reduce((q, f) => f(q), r);
const serverTimestamp = () => fb.database.ServerValue.TIMESTAMP;
const onValue = (r, cb) => r.on("value", cb), onChildAdded = (r, cb) => r.on("child_added", cb), onChildRemoved = (r, cb) => r.on("child_removed", cb);
const createUserWithEmailAndPassword = (a, e, p) => a.createUserWithEmailAndPassword(e, p);
const signInWithEmailAndPassword = (a, e, p) => a.signInWithEmailAndPassword(e, p);
const updateProfile = (u, p) => u.updateProfile(p);
const onAuthStateChanged = (a, cb) => a.onAuthStateChanged(cb);
const signOut = a => a.signOut();

// ====== YAHAN APNA FIREBASE CONFIG PASTE KARO ======
const firebaseConfig = {
  apiKey: "AIzaSyBZkB5tUPEPCxFiAyPJaThrpof7NO_ffFw",
  authDomain: "chatappdibya.firebaseapp.com",
  databaseURL: "https://chatappdibya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatappdibya",
  appId: "1:266503318985:web:0c3d26fd2c4d5e470d8c18"
};
// ===================================================

const ADMIN_UID = "TkdZFaOuM8huIE3I5l6TSWHfHnY2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const HIST = "chat_history_v1";
let muteUntil = 0, users = {}, bans = {}, mutes = {}, me = null, signup = false, started = false, seen = new Set(), cache = [];

$("swap").onclick = () => {
  signup = !signup;
  $("title").textContent = signup ? "Naya account" : "Login";
  $("go").textContent = signup ? "Account banao" : "Login";
  $("swap").textContent = signup ? "Pehle se account hai? Login" : "Naya account banana hai?";
  $("err").textContent = "";
};

async function submit() {
  const name = $("name").value.trim(), pass = $("pass").value;
  if (!/^[A-Za-z0-9_]{2,20}$/.test(name)) { $("err").textContent = "Username 2-20 letters/numbers/_ (bina space) ka ho"; return; }
  if (pass.length < 6) { $("err").textContent = "Password kam se kam 6 character ka ho"; return; }
  const email = name.toLowerCase() + "@dosto.chat";
  try {
    if (signup) {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    const m = {
      "auth/email-already-in-use": "Ye username le liya gaya hai",
      "auth/invalid-credential": "Username ya password galat hai",
      "auth/user-not-found": "Ye account nahi mila",
      "auth/wrong-password": "Password galat hai",
      "auth/operation-not-allowed": "Firebase mein Email/Password login ON karo"
    };
    $("err").textContent = m[e.code] || "Error: " + e.code;
  }
}
$("go").onclick = submit;
$("pass").onkeydown = e => { if (e.key === "Enter") submit(); };
$("out").onclick = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, user => {
  if (!user || started) return;
  started = true; me = user;
  $("join").style.display = "none";
  $("app").style.display = "flex";
  const myRef = ref(db, "online/" + user.uid);
  set(myRef, user.displayName);
  onDisconnect(myRef).remove();
  set(ref(db, "users/" + user.uid), user.displayName).catch(() => {});
  onValue(ref(db, "bans/" + user.uid), s => {
    if (s.exists()) document.body.innerHTML = '<div style="margin:auto;padding:24px;text-align:center"><h2>Tumhe ban kiya gaya hai</h2><p>Admin se baat karo.</p></div>';
  });
  onValue(ref(db, "mutes/" + user.uid), s => { muteUntil = s.val() || 0; refreshMute(); });
  setInterval(refreshMute, 15000);
  if (user.uid === ADMIN_UID) setupAdmin();
  try { cache = JSON.parse(localStorage.getItem(HIST) || "[]"); } catch { cache = []; }
  cache.forEach(m => { seen.add(m.k); draw(m); });
  push(ref(db, "messages"), { uid: user.uid, system: true, text: user.displayName + " online aaya", ts: serverTimestamp() });
  onValue(ref(db, "online"), s => {
    const names = Object.values(s.val() || {});
    $("online").textContent = "● Online (" + names.length + "): " + names.join(", ");
  });
  const q = query(ref(db, "messages"), limitToLast(100));
  onChildRemoved(q, s => {
    const e = $("msgs").querySelector('[data-k="' + s.key + '"]'); if (e) e.remove();
    cache = cache.filter(x => x.k !== s.key);
    try { localStorage.setItem(HIST, JSON.stringify(cache)); } catch {}
  });
  onChildAdded(q, s => {
    if (seen.has(s.key)) return;
    seen.add(s.key);
    const m = { k: s.key, ...s.val() };
    draw(m);
    cache.push(m); cache = cache.slice(-100);
    try { localStorage.setItem(HIST, JSON.stringify(cache)); } catch {}
  });
});

function draw(m) {
  const d = document.createElement("div");
  d.dataset.k = m.k;
  if (m.system) { d.className = "sys"; d.textContent = m.text; }
  else {
    d.className = "m" + (m.uid === me.uid ? " me" : "");
    const b = document.createElement("b"); b.textContent = m.user;
    const t = document.createElement("span"); t.textContent = m.text;
    d.append(b, t);
  }
  if (me.uid === ADMIN_UID) {
    const x = document.createElement("button"); x.className = "del"; x.textContent = "🗑";
    x.onclick = () => remove(ref(db, "messages/" + m.k));
    d.appendChild(x);
  }
  const box = $("msgs"); box.appendChild(d); box.scrollTop = box.scrollHeight;
}

function send() {
  const text = $("text").value.trim();
  if (!text) return;
  push(ref(db, "messages"), { uid: me.uid, user: me.displayName, text: text.slice(0, 500), ts: serverTimestamp() });
  $("text").value = "";
}
window.__ok = true;
document.getElementById("err").textContent = "";
$("send").onclick = send;

function refreshMute() {
  const on = muteUntil > Date.now();
  $("text").disabled = on; $("send").disabled = on;
  $("text").placeholder = on ? "Tum mute ho (" + new Date(muteUntil).toLocaleTimeString() + " tak)" : "Message likho...";
}

function setupAdmin() {
  $("adm").style.display = "inline-block";
  $("adm").onclick = () => { $("panel").style.display = "block"; };
  $("pclose").onclick = () => { $("panel").style.display = "none"; };
  onValue(ref(db, "users"), s => { users = s.val() || {}; renderPanel(); });
  onValue(ref(db, "bans"), s => { bans = s.val() || {}; renderPanel(); });
  onValue(ref(db, "mutes"), s => { mutes = s.val() || {}; renderPanel(); });
}

function renderPanel() {
  const box = $("plist"); box.textContent = "";
  Object.entries(users).forEach(([uid, name]) => {
    if (uid === ADMIN_UID) return;
    const row = document.createElement("div"); row.className = "row";
    const n = document.createElement("span");
    n.textContent = name + (bans[uid] ? "  🚫 banned" : (mutes[uid] > Date.now() ? "  🔇 mute" : ""));
    row.appendChild(n);
    const add = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; row.appendChild(b); };
    add("Mute 10m", () => set(ref(db, "mutes/" + uid), Date.now() + 600000));
    add("Mute 1h", () => set(ref(db, "mutes/" + uid), Date.now() + 3600000));
    add("Unmute", () => remove(ref(db, "mutes/" + uid)));
    add(bans[uid] ? "Unban" : "Ban", () => {
      if (bans[uid]) remove(ref(db, "bans/" + uid));
      else { set(ref(db, "bans/" + uid), true); remove(ref(db, "online/" + uid)); }
    });
    box.appendChild(row);
  });
  if (!box.children.length) box.textContent = "Abhi koi aur user nahi hai.";
}
$("text").onkeydown = e => { if (e.key === "Enter") send(); };
</script>
</body>
</html>

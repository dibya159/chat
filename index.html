<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosto ka Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ea;height:100dvh;display:flex;flex-direction:column}
#join{margin:auto;text-align:center;padding:24px;width:min(360px,92%)}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #333;background:#1b1e25;color:inherit;font-size:16px}
button{padding:12px 18px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:16px;cursor:pointer}
#join button{margin-top:12px;width:100%}
#swap{background:none;color:#8fb0ff;font-size:14px;margin-top:4px}
#err{color:#ff6b6b;min-height:20px;margin-top:8px;font-size:14px}
#app{display:none;flex-direction:column;height:100%}
header{padding:10px 14px;background:#171a21;border-bottom:1px solid #262a33;font-size:14px}
#top{display:flex;justify-content:space-between;align-items:center}
#out{padding:4px 10px;font-size:12px;background:#2a2f3a}
#online{color:#6ee7a0;margin-top:4px;overflow-x:auto;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:#1b1e25;word-wrap:break-word}
.m b{display:block;font-size:12px;color:#8fb0ff;margin-bottom:2px}
.m.me{align-self:flex-end;background:#2b4bb5}
.m.me b{display:none}
.sys{align-self:center;font-size:12px;color:#888}
#bar{display:flex;gap:8px;padding:10px;background:#171a21}
#bar input{margin:0}
</style>
</head>
<body>
<div id="join">
  <h2 id="title">Login</h2>
  <input id="name" maxlength="20" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <button id="go">Login</button>
  <button id="swap">Naya account banana hai?</button>
  <div id="err"></div>
</div>
<div id="app">
  <header>
    <div id="top"><b>Dosto ka Chat</b><button id="out">Logout</button></div>
    <div id="online"></div>
  </header>
  <div id="msgs"></div>
  <div id="bar"><input id="text" placeholder="Message likho..." autocomplete="off"><button id="send">Send</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, onChildAdded, onDisconnect, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== YAHAN APNA FIREBASE CONFIG PASTE KARO ======
const firebaseConfig = {
  apiKey: "AIzaSyBZkB5tUPEPCxFiAyPJaThrpof7NO_ffFw",
  authDomain: "chatappdibya.firebaseapp.com",
  databaseURL: "https://chatappdibya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatappdibya",
  appId: "1:266503318985:web:0c3d26fd2c4d5e470d8c18"
};
// ===================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const HIST = "chat_history_v1";
let me = null, signup = false, started = false, seen = new Set(), cache = [];

$("swap").onclick = () => {
  signup = !signup;
  $("title").textContent = signup ? "Naya account" : "Login";
  $("go").textContent = signup ? "Account banao" : "Login";
  $("swap").textContent = signup ? "Pehle se account hai? Login" : "Naya account banana hai?";
  $("err").textContent = "";
};

async function submit() {
  const name = $("name").value.trim(), pass = $("pass").value;
  if (!/^[A-Za-z0-9_]{2,20}$/.test(name)) { $("err").textContent = "Username 2-20 letters/numbers/_ (bina space) ka ho"; return; }
  if (pass.length < 6) { $("err").textContent = "Password kam se kam 6 character ka ho"; return; }
  const email = name.toLowerCase() + "@dosto.chat";
  try {
    if (signup) {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    const m = {
      "auth/email-already-in-use": "Ye username le liya gaya hai",
      "auth/invalid-credential": "Username ya password galat hai",
      "auth/user-not-found": "Ye account nahi mila",
      "auth/wrong-password": "Password galat hai",
      "auth/operation-not-allowed": "Firebase mein Email/Password login ON karo"
    };
    $("err").textContent = m[e.code] || "Error: " + e.code;
  }
}
$("go").onclick = submit;
$("pass").onkeydown = e => { if (e.key === "Enter") submit(); };
$("out").onclick = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, user => {
  if (!user || started) return;
  started = true; me = user;
  $("join").style.display = "none";
  $("app").style.display = "flex";
  const myRef = ref(db, "online/" + user.uid);
  set(myRef, user.displayName);
  onDisconnect(myRef).remove();
  try { cache = JSON.parse(localStorage.getItem(HIST) || "[]"); } catch { cache = []; }
  cache.forEach(m => { seen.add(m.k); draw(m); });
  push(ref(db, "messages"), { uid: user.uid, system: true, text: user.displayName + " online aaya", ts: serverTimestamp() });
  onValue(ref(db, "online"), s => {
    const names = Object.values(s.val() || {});
    $("online").textContent = "● Online (" + names.length + "): " + names.join(", ");
  });
  onChildAdded(query(ref(db, "messages"), limitToLast(100)), s => {
    if (seen.has(s.key)) return;
    seen.add(s.key);
    const m = { k: s.key, ...s.val() };
    draw(m);
    cache.push(m); cache = cache.slice(-100);
    try { localStorage.setItem(HIST, JSON.stringify(cache)); } catch {}
  });
});

function draw(m) {
  const d = document.createElement("div");
  if (m.system) { d.className = "sys"; d.textContent = m.text; }
  else {
    d.className = "m" + (m.uid === me.uid ? " me" : "");
    const b = document.createElement("b"); b.textContent = m.user;
    const t = document.createElement("span"); t.textContent = m.text;
    d.append(b, t);
  }
  const box = $("msgs"); box.appendChild(d); box.scrollTop = box.scrollHeight;
}

function send() {
  const text = $("text").value.trim();
  if (!text) return;
  push(ref(db, "messages"), { uid: me.uid, user: me.displayName, text: text.slice(0, 500), ts: serverTimestamp() });
  $("text").value = "";
}
$("send").onclick = send;
$("text").onkeydown = e => { if (e.key === "Enter") send(); };
</script>
</body>
</html>

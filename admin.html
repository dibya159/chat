
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - User Control</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8ea;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 20px;background:#171a21;border-bottom:1px solid #262a33;display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:18px;color:#8fb0ff}
section{flex:1;padding:16px;overflow-y:auto}
h3{margin-top:0;font-size:15px;color:#a0aabf;border-bottom:1px solid #262a33;padding-bottom:8px}
.card{background:#1b1e25;padding:10px 14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
button{padding:6px 12px;border:0;border-radius:6px;background:#ff5c5c;color:#fff;font-size:12px;cursor:pointer;margin-left:8px}
button.mute{background:#fab005}
button.unban{background:#4f7cff}
.user-info{display:flex;flex-direction:column}
.user-status{font-size:11px;color:#6ee7a0}
#auth-guard{margin:auto;text-align:center;padding:24px;width:min(360px,92%)}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #333;background:#1b1e25;color:inherit;font-size:16px}
#auth-guard button{width:100%;margin-top:12px;padding:12px;background:#4f7cff;font-size:16px}
#err{color:#ff6b6b;min-height:20px;margin-top:8px;font-size:14px}
</style>
</head>
<body>

<div id="auth-guard">
  <h2>Admin Login</h2>
  <p style="font-size: 13px; color: #888;">Apne account se login karo</p>
  <input id="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login">Login</button>
  <div id="err"></div>
</div>

<div id="admin-app" style="display:none;flex-direction:column;height:100%;">
  <header>
    <h2>🛡️ Admin Dashboard: Moderation</h2>
    <span id="user-info" style="font-size: 13px;"></span>
    <button style="background:#4f7cff;" id="logout">Logout</button>
  </header>

  <section>
    <h3>👥 Manage Members</h3>
    <div id="users-list"></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZkB5tUPEPCxFiAyPJaThrpof7NO_ffFw",
  authDomain: "chatappdibya.firebaseapp.com",
  databaseURL: "https://chatappdibya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chatappdibya",
  appId: "1:266503318985:web:0c3d26fd2c4d5e470d8c18"
};

// Tumhara Admin UID yahan configured hai:
const ADMIN_UID = "O0dUaKrzD3YcE5OeLyWlRxJXVsG3";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);

async function login() {
  const email = $("email").value.trim();
  const pass = $("pass").value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    $("err").textContent = "Login failed: " + e.code;
  }
}

$("login").onclick = login;
$("pass").onkeydown = e => { if (e.key === "Enter") login(); };
$("logout").onclick = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, user => {
  if (!user) return;
  
  if (user.uid !== ADMIN_UID) {
    $("err").textContent = "Aap admin nahi ho!";
    signOut(auth);
    return;
  }

  $("auth-guard").style.display = "none";
  $("admin-app").style.display = "flex";
  $("user-info").textContent = "Admin: " + user.displayName;

  // Load Users Database
  onValue(ref(db, "online"), snapshot => {
    const list = $("users-list");
    list.innerHTML = "";
    const data = snapshot.val() || {};
    
    for (const [uid, name] of Object.entries(data)) {
      const div = document.createElement("div");
      div.className = "card";
      
      div.innerHTML = `
        <div class="user-info">
          <b>👤 ${name}</b>
          <span class="user-status">Online</span>
        </div>
        <div>
          <button class="mute" onclick="updateStatus('${uid}', 'muted', true)">Mute</button>
          <button onclick="updateStatus('${uid}', 'banned', true)">Ban</button>
        </div>
      `;
      list.appendChild(div);
    }
    if (Object.keys(data).length === 0) {
      list.innerHTML = '<div style="color:#666;font-size:13px">Abhi koi online nahi hai</div>';
    }
  });
});
</script>

<script>
async function updateStatus(uid, field, value) {
  const { getDatabase, ref, update } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";) // safe import
  // Alternatively handled via standard reference if needed
}
</script>

</body>
</html>
